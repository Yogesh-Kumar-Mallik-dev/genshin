<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>空荧酒馆 | 原神地图</title>
    <link rel="icon" href="/map-client/favicon.svg" type="image/svg+xml" />
    <style>
      /* 错误兜底 UI - 自包含样式，不依赖外部 CSS */
      #app-error {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        place-items: center;
        padding: 24px;
        background: light-dark(#fafafa, #1a1a1a);
        color: light-dark(#333, #e0e0e0);
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        overflow: auto;
      }
      .error-card {
        max-width: 640px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .error-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: light-dark(oklch(0.65 0.22 25), oklch(0.7 0.2 25));
        color: #fff;
        display: grid;
        place-content: center;
        flex-shrink: 0;
      }
      .error-title {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .error-desc {
        margin: 0;
        line-height: 1.6;
        color: light-dark(#666, #aaa);
        font-size: 14px;
      }
      .error-stack {
        margin: 0;
        padding: 16px;
        background: light-dark(#f0f0f0, #2a2a2a);
        border: 1px solid light-dark(#e0e0e0, #3a3a3a);
        border-radius: 8px;
        font-family:
          'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.5;
        max-height: 320px;
        overflow: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .error-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .error-btn {
        padding: 8px 16px;
        border: 1px solid light-dark(#ddd, #444);
        background: light-dark(#fff, #2a2a2a);
        color: light-dark(#333, #eee);
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-family: inherit;
        transition: background 0.15s;
      }
      .error-btn:hover {
        background: light-dark(#f0f0f0, #333);
      }
      .error-btn-primary {
        background: light-dark(oklch(0.63 0.16 52.36), oklch(0.86 0.12 76.43));
        color: light-dark(#fff, #1a1a1a);
        border-color: transparent;
      }
      .error-btn-primary:hover {
        background: light-dark(oklch(0.55 0.16 52.36), oklch(0.9 0.1 76.43));
      }
    </style>
    <script type="module" crossorigin src="/map-client/assets/index-aHlmRunF.js"></script>
    <link rel="stylesheet" crossorigin href="/map-client/assets/index-B4r1bH-R.css">
  </head>
  <body class="grid">
    <!-- 首屏 loading -->
    <div id="loading-container" class="fixed-page">
      <div id="loading"></div>
    </div>

    <!-- 应用容器 -->
    <div id="app" class="fixed-page"></div>

    <!-- 初始化 JS -->
  </body>
</html>
