services:
  genshin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genshin
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genshin.rule=Host(`genshin.yogeshmallik.in`)"
      - "traefik.http.routers.genshin.entrypoints=websecure"
      - "traefik.http.routers.genshin.tls=true"
      - "traefik.http.routers.genshin.tls.certresolver=letsencrypt"
      - "traefik.http.services.genshin.loadbalancer.server.port=3000"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
